name: Auto Farm Windows
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: token-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py diagnostico.py embarque.py logica_autofarm.py texto_tela.py windows_game.py
      - run: python preparar_ocr.py
      - run: python -m unittest discover -s tests
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name AutoFarmTokenPirata --collect-all rapidocr --copy-metadata rapidocr --add-data "modelos;modelos" --add-data "templates;templates" app.py
      - shell: pwsh
        run: |
          $smoke = Start-Process -FilePath "dist/AutoFarmTokenPirata.exe" -ArgumentList "--verificar-build" -WindowStyle Hidden -Wait -PassThru
          exit $smoke.ExitCode
      - shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/AutoFarmTokenPirata.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/AutoFarmTokenPirata.exe.sha256" -Value "$hash  AutoFarmTokenPirata.exe" -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: AutoFarmTokenPirata-Windows
          path: |
            dist/AutoFarmTokenPirata.exe
            dist/AutoFarmTokenPirata.exe.sha256
      - if: github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = python -c "from versao import VERSAO; print(VERSAO)"
          $tag = "v$version"
          if ($env:BUILD_REF -ne 'main' -and $env:BUILD_REF -ne $tag) { throw "A tag e a versão do app precisam corresponder." }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag dist/AutoFarmTokenPirata.exe dist/AutoFarmTokenPirata.exe.sha256 --target $env:GITHUB_SHA --title "Auto Farm $tag" --generate-notes
          exit $LASTEXITCODE
