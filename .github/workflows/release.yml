name: Auto Farm Windows
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: token-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py macro_token_pirata.py
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name AutoFarmTokenPirata --collect-data tzdata app.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoFarmTokenPirata-Windows
          path: dist/AutoFarmTokenPirata.exe
      - if: github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ github.ref_name }}
        shell: pwsh
        run: |
          if ($env:BUILD_REF -eq 'main') {
            $tag = 'v1.0.0'
          } else {
            $tag = $env:BUILD_REF
          }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag dist/AutoFarmTokenPirata.exe --target $env:GITHUB_SHA --title "Auto Farm $tag" --generate-notes
          exit $LASTEXITCODE
