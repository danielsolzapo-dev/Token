name: Auto Farm Windows
on:
  push:
    branches: ['main', 'teste-fila']
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: token-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py macro_token_pirata.py reconhecimento.py atualizacao.py
      - run: python preparar_ocr.py
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name AutoFarmTokenPirata --collect-data tzdata --collect-all rapidocr --copy-metadata rapidocr --add-data "modelos;modelos" app.py
      - shell: pwsh
        run: |
          $smoke = Start-Process -FilePath "dist/AutoFarmTokenPirata.exe" -ArgumentList "--verificar-build" -WindowStyle Hidden -Wait -PassThru
          exit $smoke.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: AutoFarmTokenPirata-Windows
          path: dist/AutoFarmTokenPirata.exe
      - if: github.ref_name == 'main' || github.ref_name == 'teste-fila' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = python -c "from versao import VERSAO; print(VERSAO)"
          $tag = "v$version"
          $opcoes = @()
          if ($env:BUILD_REF -eq 'teste-fila') {
            $tag = "$tag-teste.1"
            $opcoes += '--prerelease'
          } elseif ($env:BUILD_REF -ne 'main' -and $env:BUILD_REF -ne $tag) {
            throw "A tag e a versão do app precisam corresponder."
          }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag dist/AutoFarmTokenPirata.exe --target $env:GITHUB_SHA --title "Auto Farm $tag" --generate-notes @opcoes
          exit $LASTEXITCODE
